<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>문화적응 여정</title>
  <meta name="description" content="존 베리의 문화적응 모델로 나의 마음을 돌아보고 이야기를 나누는 앱">
  <meta name="theme-color" content="#8EC5FF">
  <meta name="robots" content="noindex, nofollow">

  <!-- 📲 앱(PWA) 설정 -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="문화적응여정">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <!-- 글꼴: 제목·본문 모두 Pretendard 하나로 통일 (한국어·영어 모두 읽기 편해요) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="style.css?v=34">
</head>
<body>
  <!-- ☁️ 배경 -->
  <div class="sky" aria-hidden="true"></div>

  <!-- 상단 바 -->
  <header class="topbar">
    <div class="brand"><span class="brand-emo">✈️</span><span>문화적응 여정</span></div>
    <div class="top-actions">
      <!-- 언어 버튼: 文A(세계 공통 언어 아이콘) + 지금 언어 + ▾ → 누르면 언어 목록 (언어가 늘어나도 그대로 써요) -->
      <button type="button" class="lang-btn notranslate" translate="no" data-open-guide="lang" aria-label="Language">
        <span class="ln-ic" aria-hidden="true">文A</span><span class="ln-name" id="ln-name">한국어</span><span class="ln-code" id="ln-code">KO</span><span class="ln-caret" aria-hidden="true">▾</span>
      </button>
      <button class="icon-btn help-btn notranslate" translate="no" id="help-top" aria-label="Help">Help</button>
    </div>
  </header>

  <main>
    <!-- ================= 🧭 여정 탭 ================= -->
    <section id="view-journey" class="view">

      <!-- STEP 1: 아바타 만들기 -->
      <div id="step-avatar" class="card">
        <div class="steps-dots" aria-label="1 / 3"><i class="on"></i><i></i><i></i></div>
        <h2>나의 아바타를 만들어요</h2>
        <p class="muted">모양·색·표정을 골라 나를 닮은 캐릭터를 꾸며 보세요.</p>

        <div class="av-stage"><div id="av-preview" class="av-big"></div></div>

        <div id="av-options"></div>

        <label class="field">
          <span class="field-label">별명</span>
          <input type="text" id="user-name" placeholder="다른 사람에게 보일 이름" autocomplete="off" enterkeyhint="done" maxlength="20">
        </label>
        <button id="start-btn" class="btn btn-primary">여정 시작하기</button>
      </div>

      <!-- 수정 중 표시 (2·3단계 위) -->
      <div id="edit-banner" class="edit-banner hidden">
        <span>내 이야기를 수정하고 있어요</span>
        <button type="button" id="edit-cancel" class="link-btn">수정 그만두기</button>
      </div>

      <!-- STEP 2: 나의 지금 마음 확인하기 (한 화면에 한 가지 일만) -->
      <div id="step-pos" class="hidden">
        <div class="card">
          <div class="steps-dots" aria-label="2 / 3"><i class="done"></i><i class="on"></i><i></i></div>
          <h2>나는 어디에 있을까요?</h2>
          <div class="me-row" id="me-row"></div>
          <p class="muted">막대에서 <b>지금 내 마음과 가장 가까운 곳</b>을 눌러 주세요. 두 단계 사이(경계)도 고를 수 있어요.</p>
          <div id="spectrum"></div>
          <div class="info-box note-open" id="spectrum-note"></div>
        </div>
        <div class="row-btns">
          <button id="back-btn" class="btn btn-ghost">◀ 이전</button>
          <button id="pos-next" class="btn btn-primary">다음</button>
        </div>
      </div>

      <!-- STEP 3: 나의 이야기 -->
      <div id="step-write" class="hidden">
        <div class="card">
          <div class="steps-dots" aria-label="3 / 3"><i class="done"></i><i class="done"></i><i class="on"></i></div>
          <h2>나의 이야기</h2>
          <p class="lead">4가지 질문 모두 <b>한국에서 지내며 겪은 일</b>에 대한 거예요. 한국에서의 생활을 떠올리며 답해 주세요.</p>
          <div id="qa-write"></div>
        </div>
        <div class="row-btns">
          <button id="back-pos" class="btn btn-ghost">◀ 이전</button>
          <button id="share-btn" class="btn btn-primary">이야기 올리기</button>
        </div>
      </div>

      <!-- 완료 -->
      <div id="step-done" class="card center hidden">
        <div id="done-avatar" class="av-big"></div>
        <h2 id="done-title">이야기가 올라갔어요!</h2>
        <p id="done-text" class="muted"></p>
        <button id="go-board" class="btn btn-primary">모두의 이야기 보러 가기</button>
        <div class="done-links">
          <button id="ext-share" class="link-btn">친구에게 링크 보내기</button>
          <span aria-hidden="true">·</span>
          <button id="new-story" class="link-btn">새 이야기 쓰기</button>
        </div>
      </div>
    </section>

    <!-- ================= 💌 모두의 이야기 탭 ================= -->
    <section id="view-board" class="view hidden">
      <div class="card slim">
        <div class="title-row">
          <h2>모두의 이야기</h2>
        </div>
        <p class="muted" id="board-count">이야기를 불러오는 중이에요…</p>
        <div class="filter-chips" id="filter-chips"></div>
        <!-- 이야기 번역: 작은 버튼 하나 → 누르면 원문 / 한국어 / English 고르기 -->
        <div class="tr-row">
          <button type="button" class="tr-btn" id="tr-btn"><span class="ln-ic notranslate" translate="no" aria-hidden="true">文A</span><span>이야기 번역</span><b id="tr-cur">원문</b><span class="ln-caret" aria-hidden="true">▾</span></button>
          <span id="tr-status" class="tr-status"></span>
        </div>
      </div>

      <div class="deck-nav" id="deck-nav">
        <button type="button" class="deck-arrow" id="deck-prev" aria-label="이전 이야기">◀</button>
        <span class="deck-count notranslate" translate="no" id="deck-count">0 / 0</span>
        <button type="button" class="deck-arrow" id="deck-next" aria-label="다음 이야기">▶</button>
      </div>
      <div id="feed-list" class="deck"></div>
    </section>

  </main>

  <!-- 하단 탭바 -->
  <nav class="tabbar">
    <button class="tab active" data-tab="journey"><span>🧭</span>여정</button>
    <button class="tab" data-tab="board"><span>💌</span>모두의 이야기</button>
  </nav>

  <!-- 모달 (안내 / 공유 / 메뉴) -->
  <div id="sheet" class="sheet-backdrop hidden" role="dialog" aria-modal="true">
    <div class="sheet" id="sheet-body"></div>
  </div>

  <div id="toast" class="toast"></div>

  <script type="module" src="app.js?v=34"></script>
</body>
</html>
